name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar
        run: mvn -B clean package

      - name: Mostrar lo que se genero
        run: ls -la target

      - uses: actions/upload-artifact@v4
        with:
          name: BatmanInventoryRollback
          path: |
            target/*.jar
            !target/original-*.jar
          if-no-files-found: error
