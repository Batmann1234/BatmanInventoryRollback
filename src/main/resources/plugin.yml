name: ${project.name}
main: ${project.groupId}.InventoryRollbackPlus
version: ${project.version}
description: ${project.description}
author: ${project.organization.name}
authors: [${project.organization.name}, danjono]
api-version: 1.13

loadbefore:
  - DeluxeCombat
  - DeadChest
  - AngelChest
  - SavageDeathChest

commands:
  batmaninventoryrollback:
    description: ${project.description}
    usage: /bir <subcomando>
    aliases: [bir]

permissions:
  batmaninventoryrollback.*:
    description: Gives access to all BatmanInventoryRollback commands.
    children:
      batmaninventoryrollback.cmd: true
      batmaninventoryrollback.deathsave: true
      batmaninventoryrollback.joinsave: true
      batmaninventoryrollback.leavesave: true
      batmaninventoryrollback.worldchangesave: true
      batmaninventoryrollback.enable: true
      batmaninventoryrollback.disable: true
      batmaninventoryrollback.reload: true
      batmaninventoryrollback.restore: true
      batmaninventoryrollback.forcebackup: true
      batmaninventoryrollback.version: true
      batmaninventoryrollback.help: true
      batmaninventoryrollback.adminalerts: true
      batmaninventoryrollback.viewbackups: true
    default: op
  batmaninventoryrollback.cmd:
    description: Allows InventoryRollback commands to work.
    default: true
  batmaninventoryrollback.deathsave:
    description: Player inventories will be saved when they die.
    default: true
  batmaninventoryrollback.joinsave:
    description: Player inventories will be saved when the join.
    default: true
  batmaninventoryrollback.leavesave:
    description: Player inventories will be saved when they leave.
    default: true
  batmaninventoryrollback.worldchangesave:
    description: Player inventories will be saved when they change worlds.
    default: true
  batmaninventoryrollback.enable:
    description: Grants access to enable the plugin globally.
    default: op
  batmaninventoryrollback.disable:
    description: Grants access to disable the plugin globally.
    default: op
  batmaninventoryrollback.reload:
    description: Grants access to reload the plugin configuration.
    default: op
  batmaninventoryrollback.restore:
    description: Grants access to perform player roll backs.
    default: op
    children:
      batmaninventoryrollback.viewbackups: true
      batmaninventoryrollback.restore.teleport:
        default: op
        description: Allow the staff member to teleport to the location where the backup was saved
  batmaninventoryrollback.forcebackup:
    description: Forces a backup for an online player.
    default: op
  batmaninventoryrollback.viewbackups:
    description: Allows player to view player backups but can't take items from the backups or restore the target's inventory
    default: op
  batmaninventoryrollback.adminalerts:
    description: Allows player to receive extra notifications related to the plugin when joining.
    default: op
  batmaninventoryrollback.version:
    description: Allows player to see the version the plugin is running on the server.
    default: true
  batmaninventoryrollback.help:
    description: Get the list of commands and what they do
    default: true

  batmaninventoryrollback.viewonly:
    description: Read-only mode. Can browse backups but cannot restore, overwrite, teleport, force-save or reload, even if the player also has batmaninventoryrollback.* or batmaninventoryrollback.restore.
    default: false
  # ---- LEGACY COMPATIBILITY ----
  inventoryrollback.cmd:
    description: Allows InventoryRollback commands to work.
    default: false
    children:
      batmaninventoryrollback.cmd: true
  inventoryrollback.deathsave:
    description: Player inventories will be saved when they die.
    default: false
    children:
      batmaninventoryrollback.deathsave: true
  inventoryrollback.joinsave:
    description: Player inventories will be saved when the join.
    default: false
    children:
      batmaninventoryrollback.joinsave: true
  inventoryrollback.leavesave:
    description: Player inventories will be saved when they leave.
    default: false
    children:
      batmaninventoryrollback.leavesave: true
  inventoryrollback.worldchangesave:
    description: Player inventories will be saved when they change worlds.
    default: false
    children:
      batmaninventoryrollback.worldchangesave: true
  inventoryrollback.enable:
    description: Grants access to enable the plugin globally.
    default: false
    children:
      batmaninventoryrollback.enable: true
  inventoryrollback.disable:
    description: Grants access to disable the plugin globally.
    default: false
    children:
      batmaninventoryrollback.disable: true
  inventoryrollback.reload:
    description: Grants access to reload the plugin configuration.
    default: false
    children:
      batmaninventoryrollback.reload: true
  inventoryrollback.restore:
    description: Grants access to perform player roll backs.
    default: false
    children:
      batmaninventoryrollback.restore: true
  inventoryrollback.forcebackup:
    description: Forces a backup for an online player.
    default: false
    children:
      batmaninventoryrollback.forcebackup: true
  inventoryrollback.version:
    description: Allows player to see the version the plugin is running on the server.
    default: false
    children:
      batmaninventoryrollback.version: true